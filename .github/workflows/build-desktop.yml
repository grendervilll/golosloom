name: build-desktop

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

# Публикация релиза требует права на запись в содержимое репозитория.
permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - run: npm ci
        working-directory: web
      - run: npm ci
        working-directory: desktop
      # Раннер Intel, поэтому собираем для Apple Silicon явно.
      - run: npm run tauri build -- --target aarch64-apple-darwin --bundles app,dmg
        working-directory: desktop
      - uses: actions/upload-artifact@v4
        with:
          name: golosloom-macos-aarch64
          path: |
            desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app
          if-no-files-found: error
      - name: Publish to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app
          fail_on_unmatched_files: false

  build-windows:
    strategy:
      matrix:
        arch: [x86_64, aarch64]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.arch == 'aarch64' && 'aarch64-pc-windows-msvc' || 'x86_64-pc-windows-msvc' }}
      - run: npm ci
        working-directory: web
      - run: npm ci
        working-directory: desktop
      - name: Build for ${{ matrix.arch }}
        run: npm run tauri build -- --target ${{ matrix.arch == 'aarch64' && 'aarch64-pc-windows-msvc' || 'x86_64-pc-windows-msvc' }} --bundles nsis,msi
        working-directory: desktop
      - uses: actions/upload-artifact@v4
        with:
          name: golosloom-windows-${{ matrix.arch }}
          path: |
            desktop/src-tauri/target/${{ matrix.arch == 'aarch64' && 'aarch64-pc-windows-msvc' || 'x86_64-pc-windows-msvc' }}/release/bundle/nsis/*.exe
            desktop/src-tauri/target/${{ matrix.arch == 'aarch64' && 'aarch64-pc-windows-msvc' || 'x86_64-pc-windows-msvc' }}/release/bundle/msi/*.msi
          if-no-files-found: error
      - name: Publish to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/src-tauri/target/${{ matrix.arch == 'aarch64' && 'aarch64-pc-windows-msvc' || 'x86_64-pc-windows-msvc' }}/release/bundle/nsis/*.exe
            desktop/src-tauri/target/${{ matrix.arch == 'aarch64' && 'aarch64-pc-windows-msvc' || 'x86_64-pc-windows-msvc' }}/release/bundle/msi/*.msi
          fail_on_unmatched_files: false

  build-linux:
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf libgtk-3-dev
          # Индикатор-библиотека для трея: в 24.04 переименована
          sudo apt-get install -y libayatana-appindicator3-dev || sudo apt-get install -y libappindicator3-dev
      - run: npm ci
        working-directory: web
      - run: npm ci
        working-directory: desktop
      - name: Build for ${{ matrix.arch }}
        run: npm run tauri build
        working-directory: desktop
      - uses: actions/upload-artifact@v4
        with:
          name: golosloom-linux-${{ matrix.arch }}
          path: desktop/src-tauri/target/release/bundle/**
          if-no-files-found: error
      - name: Publish to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/src-tauri/target/release/bundle/deb/*.deb
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            desktop/src-tauri/target/release/golosloom
          fail_on_unmatched_files: false
