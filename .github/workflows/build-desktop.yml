name: build-desktop

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npm ci
        working-directory: desktop
      - run: npx tsc
        working-directory: desktop
      - run: npm run prebuild
        working-directory: desktop
      - run: npm run build -- --mac
        working-directory: desktop
      - uses: actions/upload-artifact@v5
        with:
          name: golosloom-macos
          path: desktop/dist/*.dmg
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npm ci
        working-directory: desktop
      - run: npx tsc
        working-directory: desktop
      - run: npm run prebuild
        working-directory: desktop
      - run: npm run build -- --win
        working-directory: desktop
      - uses: actions/upload-artifact@v5
        with:
          name: golosloom-windows
          path: desktop/dist/*.exe
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npm ci
        working-directory: desktop
      - run: npx tsc
        working-directory: desktop
      - run: npm run prebuild
        working-directory: desktop
      - run: npm run build -- --linux
        working-directory: desktop
      - uses: actions/upload-artifact@v5
        with:
          name: golosloom-linux
          path: desktop/dist/*.AppImage
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          fail_on_matched_files: false
