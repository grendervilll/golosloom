# Сборка Android APK (Golosloom mobile).
# По тегу v* — прикладывает APK к GitHub Release (оттуда приложение
# узнаёт о новой версии и предлагает обновление).
# Вручную — только артефакты (вкладка Actions → Run workflow).
name: build-android

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      # google-services.json в git не хранится (секрет). Секрет
      # GOOGLE_SERVICES_JSON — это его содержимое в base64:
      #   base64 -i mobile/android/app/google-services.json | pbcopy
      # (Settings → Secrets and variables → Actions)
      # Если секрет не задан, используется файл из репозитория (если есть) — сборка не падает.
      - name: Подготовка google-services.json из секрета (если задан)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" | base64 -d > mobile/android/app/google-services.json
            echo "google-services.json подготовлен из секрета"
          elif [ -f mobile/android/app/google-services.json ]; then
            echo "используется существующий google-services.json из репозитория — сборка продолжится"
          else
            echo "::warning::google-services.json отсутствует — создаётся заглушка для сборки (push не будут работать)"
            mkdir -p mobile/android/app
            cat > mobile/android/app/google-services.json <<'JSON'
          {
            "project_info": {"project_number": "0", "project_id": "dummy", "storage_bucket": "dummy.appspot.com"},
            "client": [{"client_info": {"mobilesdk_app_id": "1:0:android:dummy", "android_client_info": {"package_name": "com.golosloom.golosloom_mobile"}}, "oauth_client": [], "api_key": [{"current_key": "dummy"}], "services": {"appinvite_service": {"other_platform_oauth_client": []}}}],
            "configuration_version": "1"
          }
          JSON
          fi

      - name: Сборка APK (по архитектурам)
        working-directory: mobile
        run: flutter build apk --release --split-per-abi

      - name: Артефакты
        uses: actions/upload-artifact@v4
        with:
          name: golosloom-apk
          path: mobile/build/app/outputs/flutter-apk/*.apk

      - name: Прикрепить к релизу
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: mobile/build/app/outputs/flutter-apk/*.apk
