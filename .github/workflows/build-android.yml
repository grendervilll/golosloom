# Сборка Android APK (Golosloom mobile).
# По тегу v* — прикладывает APK к GitHub Release (оттуда приложение
# узнаёт о новой версии и предлагает обновление).
# Вручную — только артефакты (вкладка Actions → Run workflow).
name: build-android

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Сборка APK (по архитектурам)
        working-directory: mobile
        run: flutter build apk --release --split-per-abi

      - name: Артефакты
        uses: actions/upload-artifact@v4
        with:
          name: golosloom-apk
          path: mobile/build/app/outputs/flutter-apk/*.apk

      - name: Прикрепить к релизу
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: mobile/build/app/outputs/flutter-apk/*.apk
