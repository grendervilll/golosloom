services:
  server:
    build:
      context: ../server
      dockerfile: Dockerfile
    container_name: golosloom-server
    restart: unless-stopped
    env_file: .env
    environment:
      - DB_PATH=/data/golosloom.db
      - LIVEKIT_URL=ws://host.docker.internal:7880
      - TURN_URLS=${TURN_URLS}
      - TURN_SHARED_SECRET=${TURN_SHARED_SECRET}
      - TURN_REALM=${TURN_REALM}
      - ALLOW_ORIGINS=${ALLOW_ORIGINS}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${DATA_DIR}:/data
    depends_on:
      - livekit
    networks:
      - golosloom

  web:
    build:
      context: ../web
      dockerfile: Dockerfile
    container_name: golosloom-web
    restart: unless-stopped
    volumes:
      - web-dist:/srv
    networks:
      - golosloom

  livekit:
    image: livekit/livekit-server:v1.8
    container_name: golosloom-livekit
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    # Host-сеть для медиа: при bridge-сети Docker добавляет правило iptables
    # на каждый из сотен UDP-портов — на слабых VPS старт зависает на минуты.
    network_mode: host
    volumes:
      - ${LIVEKIT_CONFIG}:/etc/livekit.yaml:ro
    environment:
      - LIVEKIT_KEYS=${LIVEKIT_API_KEY}:${LIVEKIT_API_SECRET}

  coturn:
    image: coturn/coturn:4.6
    container_name: golosloom-coturn
    restart: unless-stopped
    network_mode: host
    # Встроенный entrypoint образа генерирует RSA/dhparam при старте (долго на
    # слабых VPS). Запускаем turnserver напрямую; сертификаты подменяются после
    # выпуска Caddy (cron перезапускает coturn).
    entrypoint: ["/usr/bin/turnserver"]
    command:
      - -n
      - --log-file=stdout
      - --listening-port=3478
      - --tls-listening-port=5349
      - --realm=${TURN_REALM}
      - --use-auth-secret
      - --static-auth-secret=${TURN_SHARED_SECRET}
      - --min-port=49160
      - --max-port=49200
      - --no-cli
      - --no-tlsv1
      - --no-tlsv1_1
      - --cert=/certs/fullchain.pem
      - --pkey=/certs/privkey.pem
      - --dh-file=/certs/dhparam.pem

  caddy:
    image: caddy:2
    container_name: golosloom-caddy
    restart: unless-stopped
    environment:
      - DOMAIN=${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${DATA_DIR}/caddy:/data
      - web-dist:/srv:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - server
    networks:
      - golosloom

networks:
  golosloom:
    driver: bridge

volumes:
  web-dist:
