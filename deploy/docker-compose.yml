# Общий лимит логов для всех контейнеров: 3 файла по 10 МБ.
# Без него docker-логи (coturn, LiveKit, Caddy) забивают диск.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: 3

services:
  server:
    build:
      context: ../server
      dockerfile: Dockerfile
    container_name: golosloom-server
    restart: unless-stopped
    env_file: .env
    environment:
      - DB_PATH=/data/golosloom.db
      - AVATAR_DIR=/data/avatars
      - FILES_DIR=/data/files
      - LIVEKIT_URL=wss://${DOMAIN}
      - TURN_URLS=${TURN_URLS}
      - TURN_SHARED_SECRET=${TURN_SHARED_SECRET}
      - TURN_REALM=${TURN_REALM}
      - ALLOW_ORIGINS=${ALLOW_ORIGINS}
      - CENTRIFUGO_URL=http://centrifugo:8000
      - CENTRIFUGO_API_KEY=${CENTRIFUGO_API_KEY}
      - CENTRIFUGO_SECRET=${CENTRIFUGO_SECRET}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${DATA_DIR}:/data
      - /opt/golosloom/fcm-service-account.json:/fcm-service-account.json:ro
    depends_on:
      - livekit
      - centrifugo
    networks:
      - golosloom
    mem_limit: 256m
    logging: *default-logging
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  web:
    build:
      context: ../web
      dockerfile: Dockerfile
    container_name: golosloom-web
    restart: unless-stopped
    volumes:
      - web-dist:/srv
    networks:
      - golosloom
    mem_limit: 32m
    logging: *default-logging

  centrifugo:
    image: centrifugo/centrifugo:v5
    container_name: golosloom-centrifugo
    restart: unless-stopped
    command: centrifugo --config /etc/centrifugo/config.json
    volumes:
      - ./centrifugo.json:/etc/centrifugo/config.json:ro
      - /opt/golosloom/fcm-service-account.json:/fcm-service-account.json:ro
    ports:
      - "8000:8000"
    networks:
      - golosloom
    mem_limit: 384m
    memswap_limit: 512m
    logging: *default-logging
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  livekit:
    # v1.8 не поддерживает новый путь сигналинга /rtc/v1 (SDK: "v1 RTC path
    # not found"); v1.13 — актуальная стабильная версия.
    image: livekit/livekit-server:v1.13.5
    container_name: golosloom-livekit
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    # Host-сеть для медиа: при bridge-сети Docker добавляет правило iptables
    # на каждый из сотен UDP-портов — на слабых VPS старт зависает на минуты.
    network_mode: host
    volumes:
      - ${LIVEKIT_CONFIG}:/etc/livekit.yaml:ro
    mem_limit: 512m
    logging: *default-logging
    # Health check: HTTP-сервер LiveKit (порт 7880).
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:7880/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  coturn:
    image: coturn/coturn:4.6
    container_name: golosloom-coturn
    restart: unless-stopped
    network_mode: host
    # Встроенный entrypoint образа генерирует RSA/dhparam при старте (долго на
    # слабых VPS). Запускаем turnserver напрямую; сертификаты подменяются после
    # выпуска Caddy (cron перезапускает coturn).
    entrypoint: ["/usr/bin/turnserver"]
    command:
      - -n
      - --log-file=stdout
      - --listening-port=3478
      - --tls-listening-port=5349
      - --realm=${TURN_REALM}
      - --use-auth-secret
      - --static-auth-secret=${TURN_SHARED_SECRET}
      # Диапазон реле расширен до 100 портов: 20 участников + демонстрации.
      - --min-port=49160
      - --max-port=49260
      - --no-cli
      - --no-tlsv1
      - --no-tlsv1_1
      # Безопасность: не релеить мультикаст-адреса.
      - --no-multicast-peers
      # Защита от исчерпания портов: максимум одновременных реле-сессий.
      # user-quota не задаём: golosloom использует общий username
      # (expiry:golosloom), поэтому квота "на пользователя" работает как общая.
      - --total-quota=80
      - --cert=/certs/fullchain.pem
      - --pkey=/certs/privkey.pem
      - --dh-file=/certs/dhparam.pem
    mem_limit: 128m
    logging: *default-logging
    # Health check: TCP-подключение к TURN-порту (в образе нет wget/nc,
    # проверяем через bash /dev/tcp).
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/3478 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  caddy:
    image: caddy:2
    container_name: golosloom-caddy
    restart: unless-stopped
    environment:
      - DOMAIN=${DOMAIN}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${DATA_DIR}/caddy:/data
      - web-dist:/srv:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - server
    networks:
      - golosloom
    mem_limit: 128m
    logging: *default-logging

networks:
  golosloom:
    driver: bridge

volumes:
  web-dist:
