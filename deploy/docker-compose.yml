services:
  server:
    build:
      context: ../server
      dockerfile: Dockerfile
    container_name: golosloom-server
    restart: unless-stopped
    env_file: .env
    environment:
      - DB_PATH=/data/golosloom.db
      - LIVEKIT_URL=ws://livekit:7880
      - TURN_URLS=${TURN_URLS}
      - TURN_SHARED_SECRET=${TURN_SHARED_SECRET}
      - TURN_REALM=${TURN_REALM}
      - ALLOW_ORIGINS=https://${DOMAIN}
    volumes:
      - ./data:/data
    depends_on:
      - livekit
    networks:
      - golosloom

  web:
    build:
      context: ../web
      dockerfile: Dockerfile
    container_name: golosloom-web
    restart: unless-stopped
    volumes:
      - web-dist:/srv
    networks:
      - golosloom

  livekit:
    image: livekit/livekit-server:v1.8
    container_name: golosloom-livekit
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    environment:
      - LIVEKIT_KEYS=${LIVEKIT_API_KEY}:${LIVEKIT_API_SECRET}
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882"
      - "50000-60000:50000-60000/udp"
    networks:
      - golosloom

  coturn:
    image: coturn/coturn:4.6
    container_name: golosloom-coturn
    restart: unless-stopped
    command:
      - -n
      - --log-file=stdout
      - --listening-port=3478
      - --tls-listening-port=5349
      - --realm=${TURN_REALM}
      - --use-auth-secret
      - --static-auth-secret=${TURN_SHARED_SECRET}
      - --min-port=49160
      - --max-port=49200
      - --no-cli
      - --no-tlsv1
      - --no-tlsv1_1
      - --cert=/certs/fullchain.pem
      - --pkey=/certs/privkey.pem
      - --dh-file=/certs/dhparam.pem
    volumes:
      - ./data/certs:/certs:ro
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "5349:5349/udp"
      - "5349:5349/tcp"
      - "49160-49200:49160-49200/udp"
    networks:
      - golosloom

  caddy:
    image: caddy:2
    container_name: golosloom-caddy
    restart: unless-stopped
    environment:
      - DOMAIN=${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy:/data
      - web-dist:/srv:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - server
      - coturn
    networks:
      - golosloom

networks:
  golosloom:
    driver: bridge

volumes:
  web-dist:
