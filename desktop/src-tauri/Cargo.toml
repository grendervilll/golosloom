[package]
name = "golosloom"
version = "1.0.0"
description = "Golosloom — голосовой сервер"
authors = ["Golosloom"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = "3"

[profile.release]
strip = true
lto = true
